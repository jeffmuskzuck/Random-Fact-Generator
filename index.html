<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Random Fact Generator</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .card {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      max-width: 480px;
      text-align: center;
    }
    #fact {
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
      min-height: 3em;
    }
    button {
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      border: none;
      background: #2563eb;
      color: white;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:disabled {
      background: #9ca3af;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Random Fact Generator</h1>
    <p id="fact">Click the button to get a random fact!</p>
    <button id="btn">Get Random Fact</button>
  </div>

  <script>
    const factEl = document.getElementById("fact");
    const btn = document.getElementById("btn");

    async function fetchRandomFact() {
      try {
        btn.disabled = true;
        btn.textContent = "Loading...";
        factEl.textContent = "Fetching a cool fact for you...";

        const response = await fetch("https://uselessfacts.jsph.pl/random.json?language=en");
        if (!response.ok) {
          throw new Error("Network response was not ok");
        }

        const data = await response.json();
        factEl.textContent = data.text || "Couldn't read the fact text from the API.";
      } catch (error) {
        console.error(error);
        factEl.textContent = "Oops, something went wrong fetching a fact. Try again.";
      } finally {
        btn.disabled = false;
        btn.textContent = "Get Random Fact";
      }
    }

    btn.addEventListener("click", fetchRandomFact);

    // Optional: load a fact immediately on page load
    // fetchRandomFact();
  </script>
</body>
</html>
